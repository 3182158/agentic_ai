[project]
name = "ticket-leave-mcp"
version = "0.1.0"
description = "MCP server (streamable HTTP) exposing Acme helpdesk ticket and leave tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",
    "pyjwt>=2.8,<3",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_leave_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
